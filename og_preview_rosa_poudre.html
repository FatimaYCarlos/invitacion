<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sobre</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo blush cálido -->
  <rect width="1200" height="630" fill="#FAF2EE"/>

  <!-- Textura de puntos suave -->
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="0.7" fill="#E8B4A0" opacity="0.22"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Marco exterior -->
  <rect x="18" y="18" width="1164" height="594" stroke="#E8B4A0" stroke-width="1" opacity="0.5"/>
  <rect x="26" y="26" width="1148" height="578" stroke="#E8B4A0" stroke-width="0.5" opacity="0.22"/>

  <!-- Ornamentos en esquinas -->
  <g><line x1="14" y1="14" x2="14" y2="58" stroke="#C47A60" stroke-width="1.5"/><line x1="14" y1="14" x2="58" y2="14" stroke="#C47A60" stroke-width="1.5"/><circle cx="14" cy="14" r="3" fill="#C47A60"/></g>
  <g><line x1="1186" y1="14" x2="1186" y2="58" stroke="#C47A60" stroke-width="1.5"/><line x1="1186" y1="14" x2="1142" y2="14" stroke="#C47A60" stroke-width="1.5"/><circle cx="1186" cy="14" r="3" fill="#C47A60"/></g>
  <g><line x1="14" y1="616" x2="14" y2="572" stroke="#C47A60" stroke-width="1.5"/><line x1="14" y1="616" x2="58" y2="616" stroke="#C47A60" stroke-width="1.5"/><circle cx="14" cy="616" r="3" fill="#C47A60"/></g>
  <g><line x1="1186" y1="616" x2="1186" y2="572" stroke="#C47A60" stroke-width="1.5"/><line x1="1186" y1="616" x2="1142" y2="616" stroke="#C47A60" stroke-width="1.5"/><circle cx="1186" cy="616" r="3" fill="#C47A60"/></g>

  <!-- SOBRE — x=60, y=44, w=1080, h=500 -->
  <!-- Sombra -->
  <rect x="68" y="52" width="1080" height="500" rx="3" fill="#EDD0C4" opacity="0.4"/>
  <!-- Cuerpo -->
  <rect x="60" y="44" width="1080" height="500" rx="3" fill="#FDF8F5" stroke="#E8B4A0" stroke-width="2"/>

  <!-- Pliegues laterales -->
  <line x1="60"   y1="44"  x2="600" y2="310" stroke="#EDD0C4" stroke-width="1.5" opacity="0.8"/>
  <line x1="1140" y1="44"  x2="600" y2="310" stroke="#EDD0C4" stroke-width="1.5" opacity="0.8"/>
  <!-- Pliegues inferiores -->
  <line x1="60"   y1="544" x2="600" y2="310" stroke="#EDD0C4" stroke-width="1.2" opacity="0.55"/>
  <line x1="1140" y1="544" x2="600" y2="310" stroke="#EDD0C4" stroke-width="1.2" opacity="0.55"/>

  <!-- Solapa superior -->
  <path d="M60,44 L600,295 L1140,44 Z" fill="#F5E6DF" stroke="#E8B4A0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Brillo solapa -->
  <path d="M60,44 L600,295 L1140,44" fill="none" stroke="#FDF8F5" stroke-width="10" opacity="0.35"/>

  <!-- Lacre -->
  <circle cx="600" cy="310" r="64" fill="#C47A60" opacity="0.2"/>
  <circle cx="600" cy="310" r="58" fill="#C47A60"/>
  <circle cx="600" cy="310" r="51" fill="#B06850"/>
  <circle cx="600" cy="310" r="46" fill="#C47A60"/>
  <!-- Anillos decorativos -->
  <circle cx="600" cy="310" r="39" fill="none" stroke="#F5E6DF" stroke-width="1.5" opacity="0.65"/>
  <circle cx="600" cy="310" r="33" fill="none" stroke="#EDD0C4" stroke-width="0.8" opacity="0.4"/>

  <!-- Monograma F & C -->
  <text x="584" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#FDF8F5" opacity="0.95">F</text>
  <text x="600" y="319" font-family="Georgia, serif" font-size="13" fill="#F5E6DF" text-anchor="middle" opacity="0.85">&amp;</text>
  <text x="607" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#FDF8F5" opacity="0.95">C</text>

  <!-- Diamantes decorativos -->
  <rect x="596" y="74"   width="8" height="8" transform="rotate(45 600 78)"   fill="#E8B4A0" opacity="0.55"/>
  <rect x="596" y="504"  width="8" height="8" transform="rotate(45 600 508)"  fill="#E8B4A0" opacity="0.45"/>
  <rect x="74"   y="291" width="7" height="7" transform="rotate(45 77 294)"   fill="#E8B4A0" opacity="0.38"/>
  <rect x="1119" y="291" width="7" height="7" transform="rotate(45 1122 294)" fill="#E8B4A0" opacity="0.38"/>

  <!-- Líneas decorativas a lados del texto -->
  <line x1="60"  y1="592" x2="350" y2="592" stroke="#E8B4A0" stroke-width="0.8" opacity="0.45"/>
  <line x1="850" y1="592" x2="1140" y2="592" stroke="#E8B4A0" stroke-width="0.8" opacity="0.45"/>
  <!-- Diamante central -->
  <rect x="596" y="587" width="8" height="8" transform="rotate(45 600 591)" fill="#C47A60" opacity="0.55"/>

  <!-- Texto -->
  <text x="600" y="588" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#7A3F2A" text-anchor="middle" letter-spacing="4" opacity="0.85">tocá para descubrir</text>

  <!-- Flecha -->
  <text x="600" y="614" font-family="Arial, sans-serif" font-size="16" fill="#C47A60" text-anchor="middle" opacity="0.5">↑</text>

</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
window.onload = function() {
  setTimeout(function() {
    html2canvas(document.body, {
      scale: 1,
      width: 1200,
      height: 630,
      backgroundColor: '#FAF2EE'
    }).then(function(canvas) {
      var link = document.createElement('a');
      link.download = 'og_preview_fatima_carlos.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }, 1200);
};
</script>
</body>
</html>
